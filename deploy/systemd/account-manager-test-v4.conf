[Service]
# Production V4 uses the existing live database and environment file.
# Keep the V3 checkout untouched for instant code rollback.
WorkingDirectory=/root/flingroulette-v4-prod/server
Environment=DB_PATH=/root/account-manager-bot-test/server/test.db
Environment=TELEGRAM_MINI_APP_URL=https://flingroulette.duckdns.org/miniapp
ExecStart=
ExecStart=/root/.nvm/versions/node/v24.21.0/bin/node /root/flingroulette-v4-prod/server/dist/index.js
